name: Refresh catalog data

# Weekly refresh of the baked Hugging Face snapshot. Runs the same script a human
# would (scripts/build-catalog.mjs), which restricts to trusted publishers and
# self-guards against bad fetches (keeps last-good on empty/partial). Commits the
# refreshed snapshot straight to main when — and only when — the model data changed.
# The push uses GITHUB_TOKEN, so it does NOT retrigger Auto Release (npm stays a
# deliberate, human-cut release); Pages redeploys via its workflow_run hook.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild snapshot from Hugging Face (trusted publishers, guarded)
        run: node scripts/build-catalog.mjs

      - name: Commit if the model data changed
        run: |
          f=packages/catalog-huggingface/src/snapshot-data.js
          # The script always rewrites GENERATED_AT, so ignore a timestamp-only diff
          # to avoid a weekly no-op commit; commit only when real data changed.
          if [ -n "$(git diff -- "$f" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v 'GENERATED_AT' || true)" ]; then
            git config user.name "whatsmymodel-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$f"
            git commit -m "data: refresh Hugging Face catalog snapshot ($(date -u +%F))"
            git push
            echo "Catalog data changed — committed and pushed."
          else
            git checkout -- "$f"
            echo "No catalog changes (timestamp-only diff discarded)."
          fi
