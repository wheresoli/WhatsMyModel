name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Redeploy after the weekly catalog refresh commits new data. The refresh pushes
  # with GITHUB_TOKEN (which does not fire the `push` event above), but workflow_run
  # fires regardless — so the live site's baked snapshot stays fresh.
  workflow_run:
    workflows: ["Refresh catalog data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # On a workflow_run trigger, only deploy if the refresh succeeded; push and
    # manual dispatch always deploy.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # The whole repo is the site: index.html at the root imports ./packages/*.
      # No build step — it's buildless ESM.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
